[package]
name = "opencrayast"
description = "opencrayast command line: inspect AST edit plans, check the environment, and read structural code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["cli", "ast", "tree-sitter", "code-analysis", "developer-tools"]
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
name = "opencrayast"
path = "src/lib.rs"

[[bin]]
name = "opencrayast"
path = "src/main.rs"

[dependencies]
clap.workspace = true
opencrayast-tools.workspace = true
opencrayast-core.workspace = true
opencrayast-edit.workspace = true

[dev-dependencies]
# `Cli::try_parse_from` in the specs: the same trait the binary's own entry point uses, so a
# driven invocation parses through the real parser rather than a hand-built argv.
clap.workspace = true
tempfile.workspace = true
