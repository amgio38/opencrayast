# Dependency policy, enforced by `cargo deny check` (from milestone M0).
#
# The accounting side of this policy (the licence texts we must ship and the
# crate-by-crate list) is THIRD-PARTY-LICENSES.md, added with the first dependency.

[advisories]
# A yanked or vulnerable dependency is a defect in a project that ships binaries.
yanked = "deny"
# Known vulnerabilities are always denied. `unmaintained` and `unsound` stay
# warnings: neither means today's build is broken, and denying them would make
# routine upgrades fail for no reason a maintainer can act on.

[licenses]
# Every licence in the tree, and nothing else. A new expression fails the build.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
# MPL-2.0 and the like are not on the list on purpose. Adding one is a decision with
# an ADR, not a build fix.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are private (publish = false); only their own path dependencies may omit a
# version. Registry dependencies still may not use wildcards.
allow-wildcard-paths = true

[sources]
# Crates.io only: no git dependencies, no alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
